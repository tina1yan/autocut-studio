<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AutoCut Studio — 本地自动剪辑</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="app">

  <!-- ============================================================ HEADER -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">✂</span>
      <div>
        <h1>AutoCut Studio</h1>
        <p>本地自动剪辑 · 全部离线处理</p>
      </div>
    </div>
    <div class="topbar-status">
      <span id="ffmpegBadge" class="badge">检查中…</span>
      <span id="netBadge" class="badge badge-offline">离线模式 · 无云端上传</span>
    </div>
  </header>

  <main class="layout">

    <!-- ======================================================= LEFT PANEL -->
    <aside class="panel panel-left">
      <section class="block">
        <h2 class="block-title">1 · 导入素材 <small>拖放 MP4 / MOV</small></h2>
        <div id="dropzone" class="dropzone">
          <div class="dz-icon">⬆</div>
          <p><strong>拖放视频到这里</strong></p>
          <p class="muted">或</p>
          <button id="browseBtn" class="btn btn-ghost">选择文件…</button>
          <input type="file" id="fileInput" accept="video/mp4,video/quicktime,video/*,.mp4,.mov,.m4v,.webm,.mkv,.avi" multiple hidden />
        </div>
        <div id="fileList" class="file-list"></div>
      </section>

      <section class="block">
        <h2 class="block-title">2 · 选择风格</h2>
        <div id="presetGrid" class="preset-grid"></div>
      </section>

      <section class="block">
        <h2 class="block-title">3 · 输出设置</h2>
        <div class="field">
          <label for="aspectSel">画幅比例</label>
          <select id="aspectSel">
            <option value="9:16">竖屏 9:16 (1080×1920)</option>
            <option value="16:9">横屏 16:9 (1920×1080)</option>
            <option value="1:1">方形 1:1 (1080×1080)</option>
          </select>
        </div>
        <div class="field">
          <label for="resSel">分辨率</label>
          <select id="resSel">
            <option value="1080">1080p (高清)</option>
            <option value="720">720p (快速)</option>
            <option value="480">480p (预览)</option>
          </select>
        </div>
        <div class="field">
          <label for="orderSel">片段排序</label>
          <select id="orderSel">
            <option value="chronological">按素材顺序</option>
            <option value="score">按精彩度</option>
            <option value="shortest">最短优先</option>
            <option value="longest">最长优先</option>
          </select>
        </div>
        <div class="field">
          <label for="maxClips">最大片段数 <span id="maxClipsVal" class="muted">12</span></label>
          <input type="range" id="maxClips" min="3" max="30" step="1" value="12" />
        </div>
      </section>
    </aside>

    <!-- ====================================================== CENTER PANEL -->
    <section class="panel panel-center">

      <div class="stage-wrap">
        <div class="stage-header">
          <h2>预览</h2>
          <div class="stage-tools">
            <label class="chk"><input type="checkbox" id="privacyMode" /> 隐私遮挡模式</label>
            <button id="btnDraft" class="btn btn-ghost btn-sm">生成草稿预览</button>
          </div>
        </div>
        <div id="stage" class="stage">
          <video id="preview" class="preview" playsinline preload="metadata"></video>
          <canvas id="overlay" class="overlay"></canvas>
          <div id="stageEmpty" class="stage-empty">
            <p>导入视频后点击「自动剪辑」</p>
            <p class="muted">选择风格 → 自动剪辑 → 预览 → 导出</p>
          </div>
        </div>
        <p id="privacyHint" class="privacy-hint hidden">
          隐私模式：在画面上拖动鼠标框选要遮挡的区域（遮住姓名、位置、证件等）。松开后选择「模糊 / 马赛克 / 色块」。
        </p>
      </div>

      <div class="timeline-wrap">
        <div class="timeline-header">
          <h2>时间线 <small id="timelineMeta" class="muted"></small></h2>
          <div class="timeline-actions">
            <button id="btnAutoEdit" class="btn btn-primary">⚡ 自动剪辑</button>
            <button id="btnExport" class="btn btn-accent">⬇ 导出 MP4</button>
          </div>
        </div>
        <div id="timeline" class="timeline"></div>
      </div>

      <div id="clipEditor" class="clip-editor hidden">
        <div class="ce-head">
          <h3 id="ceTitle">片段</h3>
          <button id="ceClose" class="btn btn-ghost btn-sm">✕</button>
        </div>
        <div class="ce-body">
          <div class="ce-field">
            <label>入点 <span id="ceInVal" class="mono"></span></label>
            <input type="range" id="ceIn" min="0" max="100" step="1" value="0" />
          </div>
          <div class="ce-field">
            <label>出点 <span id="ceOutVal" class="mono"></span></label>
            <input type="range" id="ceOut" min="0" max="100" step="1" value="100" />
          </div>
          <div class="ce-field">
            <label>转场 (进入本片段)</label>
            <select id="ceTransition">
              <option value="cut">硬切 Cut</option>
              <option value="fade">淡入淡出 Fade</option>
              <option value="fadeblack">黑场 Fade Black</option>
              <option value="wipeleft">左擦除 Wipe Left</option>
              <option value="wiperight">右擦除 Wipe Right</option>
              <option value="slideup">上滑 Slide Up</option>
              <option value="slidedown">下滑 Slide Down</option>
              <option value="zoomin">放大 Zoom In</option>
              <option value="circleopen">圆形 Circle Open</option>
              <option value="dissolve">溶解 Dissolve</option>
            </select>
          </div>
          <div class="ce-field">
            <label>转场时长 <span id="ceTdVal" class="mono">0.00s</span></label>
            <input type="range" id="ceTd" min="0" max="1.5" step="0.05" value="0.3" />
          </div>
          <div class="ce-actions">
            <button id="ceRemove" class="btn btn-danger btn-sm">移除片段</button>
            <button id="cePrev" class="btn btn-ghost btn-sm">← 前移</button>
            <button id="ceNext" class="btn btn-ghost btn-sm">后移 →</button>
          </div>
        </div>
      </div>

      <div id="privacyPanel" class="privacy-panel hidden">
        <h3>隐私遮挡区域</h3>
        <div id="privacyList" class="privacy-list"></div>
        <button id="privacyClear" class="btn btn-danger btn-sm">清空全部遮挡</button>
      </div>
    </section>

    <!-- ======================================================= RIGHT PANEL -->
    <aside class="panel panel-right">
      <section class="block">
        <h2 class="block-title">导出</h2>
        <div id="exportStatus" class="export-status">
          <div class="progress-track"><div id="exportBar" class="progress-bar"></div></div>
          <p id="exportText" class="muted">尚未导出</p>
        </div>
        <div id="exportList" class="export-list"></div>
      </section>

      <section class="block">
        <h2 class="block-title">说明</h2>
        <p class="muted small" id="presetDesc">选择一个风格开始。</p>
        <ul class="tips">
          <li>场景检测基于画面差异</li>
          <li>静音检测基于音量阈值</li>
          <li>所有处理均在本机完成</li>
        </ul>
      </section>
    </aside>
  </main>

  <div id="toast" class="toast hidden"></div>
</div>
<script src="/app.js"></script>
</body>
</html>
